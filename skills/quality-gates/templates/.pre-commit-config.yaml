# Owned by the `quality-gates` skill (re-run it to regenerate). Values that mirror
# .project-conventions.yaml are noted there; the rest are skill defaults.
# Two stages, deliberately asymmetric:
#   pre-commit  -> fast & forgiving, so juniors commit often without fear
#   pre-push    -> the full gate (= CI), so nothing unverified reaches the remote
# Local hooks call `task`, so hooks, manual runs, and CI all use ONE toolchain.
default_install_hook_types: [pre-commit, pre-push]

repos:
  # Standard hygiene (fast). The three FIXERS are pinned to the commit stage:
  # a hook that modifies files mid-push would abort the push with nothing left
  # to re-stage. Fix at commit time; pre-push only verifies.
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        stages: [pre-commit]
      - id: end-of-file-fixer
        stages: [pre-commit]
      - id: mixed-line-ending
        args: ['--fix=lf']
        stages: [pre-commit]
      - id: check-merge-conflict
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        args: ['--maxkb=1000']

  # Spelling on changed files. Legitimate project terms (jargon, names) go in
  # .codespell-ignore.txt -- one word per line.
  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.1
    hooks:
      - id: codespell
        args: ['--ignore-words=.codespell-ignore.txt']
        stages: [pre-commit]

  # Secret scanning runs at commit time on ALL files, notebooks included
  # (output cells can leak keys). gitleaks manages its own binary -> no manual
  # install for Windows developers.
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks

  # Project-specific fast checks, via the single toolchain.
  - repo: local
    hooks:
      - id: precommit-fast
        name: fast project checks
        entry: task precommit-fast
        language: system
        pass_filenames: false
        stages: [pre-commit]

      - id: ci-check
        name: full CI gate (pre-push)
        entry: task ci-check
        language: system
        pass_filenames: false
        stages: [pre-push]
