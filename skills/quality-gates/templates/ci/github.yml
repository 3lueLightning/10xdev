# .github/workflows/ci-check.yml
name: ci-check
on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # diff-based hooks need full history
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: arduino/setup-task@v2
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - run: task setup
      - run: task ci-check
