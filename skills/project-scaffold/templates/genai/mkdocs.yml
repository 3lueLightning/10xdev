# Documentation config (mkdocs-material + mkdocstrings).
#   task docs-serve   -> live-reload preview at http://127.0.0.1:8000
#   task docs-build   -> static site in site/ (gitignored)
site_name: "{{project_name}}"
site_description: "A Python GenAI project."

theme:
  name: material
  features:
    - navigation.sections
    - content.code.copy

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            show_source: true
            docstring_style: google

nav:
  - Home: index.md
  - API reference: reference.md
