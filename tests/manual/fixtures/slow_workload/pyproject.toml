[project]
name = "slow"
version = "0.1.0"
description = "Profiler fixture: a CPU hotspot and a memory hog to exercise task profile-quick / profile-mem."
requires-python = ">=3.13"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/slow"]

[tool.uv]
package = true
