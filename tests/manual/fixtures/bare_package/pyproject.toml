[project]
name = "bare"
version = "0.1.0"
description = "Greenfield fixture: nothing but a src-layout package, no tooling at all."
requires-python = ">=3.13"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bare"]

[tool.uv]
package = true
